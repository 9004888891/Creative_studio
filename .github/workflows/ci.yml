name: CI
on:
  push:
    branches: [mern]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build the React app
        run: npm run build
      - name: API tests
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/cs-test
      - name: Smoke test the built app and API
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/cs-smoke
          JWT_SECRET: smoke-test-secret-0123456789abcdefghijklmnop
          SETUP_KEY: smoke
          APP_URL: http://localhost:3001
        run: |
          node server/local.js & sleep 4
          curl -fsS http://localhost:3001/api/health
          curl -fsS http://localhost:3001/api/auth/status
      - name: Print the lock file (when the repository has none yet)
        if: always() && hashFiles('package-lock.json') != ''
        run: |
          git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && exit 0
          echo LOCK-BEGIN; gzip -9c package-lock.json | base64 -w 120; echo LOCK-END
      - name: Keep the lock file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
