<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Heatmap Demo</title>
<link rel="stylesheet" href="../dist/creative-heatmap.css">
<style>
  :root { --bg: #eef1f5; --text: #18202b; --muted: #5d6877; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1217; --text: #e6eaef; --muted: #9aa5b3; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  header p { color: var(--muted); margin: 4px 0 16px; max-width: 70ch; }
  .card { border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button.demo { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid #c9d0d8; background: #fff; cursor: pointer; }
  pre { background: rgba(127,127,127,.12); padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 220px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 style="margin:0">Creative Studio</h1>
    <p>Add a static, carousel or video. The Summary tells you whether it is ready to go live and what to fix first; Learning shows what has worked across your brands. The samples below are a made-up project.</p>
  </header>
  <div class="row">
    <button class="demo" id="sample">Try a sample static</button>
    <button class="demo" id="sampleCar">Try a sample carousel</button>
    <button class="demo" id="sampleRera">Try a sample with a RERA block</button>
    <button class="demo" id="dump">Show results as data</button>
  </div>
  <div id="studio" class="card"></div>
  <pre id="out" hidden></pre>
</main>
<script src="../dist/creative-heatmap.js"></script>
<script>
  // Project details: used in the AI prompt and to pre-fill the new version. Pass yours from the dashboard.
  const project = {
    project: 'Harbourline Residences', brand: 'Harbourline Homes', location: 'Thane West', micro: 'Ghodbunder Road',
    inventory: '2 and 3 BHK apartments', priceRange: '₹1.15 Cr – ₹1.9 Cr', configs: [{ type: '2 BHK', price: '₹1.15 Cr' }],
    usps: 'Lake views, 3-acre podium, 5 min to metro', developer: 'Harbourline Homes Ltd', rera: 'P51700000000',
    // RERA check: the state comes from the location (Thane → Maharashtra) unless reraState is given.
    // reraQr: the project's QR image downloaded from the RERA portal (a made-up pattern here, it opens nothing).
    reraQr: sampleQr(),
  };
  // A made-up QR-style pattern (three finder squares and random modules) for the demo; use the real one from the portal.
  function sampleQr() {
    const n = 29, m = 6, c = document.createElement('canvas'); c.width = c.height = (n + 4) * m; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#000'; let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const finder = (r, q) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) { const ring = Math.max(Math.abs(i - 3), Math.abs(j - 3)); if (ring !== 2) x.fillRect((q + j + 2) * m, (r + i + 2) * m, m, m); } };
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) { const inF = (r < 8 && q < 8) || (r < 8 && q > n - 9) || (r > n - 9 && q < 8); if (!inF && rnd() < 0.5) x.fillRect((q + 2) * m, (r + 2) * m, m, m); }
    finder(0, 0); finder(0, n - 7); finder(n - 7, 0); return c.toDataURL('image/png');
  }
  const studio = new CreativeHeatmap(document.getElementById('studio'), {
    context: project,
    // AI reading through the demo server (needs ANTHROPIC_API_KEY there). Opened as a file, it is switched off.
    ai: location.protocol.startsWith('http') ? { endpoint: '/api/creative-analyze' } : null,
    // Voiceover transcription through the demo server (needs TRANSCRIBE_API_KEY there).
    transcribe: location.protocol.startsWith('http') ? { endpoint: '/api/creative-transcribe' } : null,
    // Ad-level results from your other dashboard (made-up numbers). In production use { url: '/api/creative-performance?project=…' }.
    // Creative intelligence: past creatives broken into elements, with their results (a made-up sample here).
    // Through the demo server the library is saved there too, so every creative added here joins it (see the Learning view).
    library: location.protocol.startsWith('http') ? { url: '/api/creative-library', save: true } : { url: '../examples/creative-library.sample.json' },
    performanceFeed: { rows: [
      { name: 'Harbourline_LakeView_Static_Oct', spend: 186000, impressions: 412000, clicks: 3900, leads: 92, ql: 18, sv: 3 },
      { name: 'Harbourline_Carousel_Oct', spend: 142000, impressions: 298000, clicks: 3300, leads: 61, ql: 21, sv: 7 },
      { name: 'Harbourline_Reel_Walkthrough', spend: 98000, impressions: 351000, clicks: 2100, leads: 38, ql: 11, sv: 4 },
      { name: 'Harbourline_Price_Static', spend: 120000, impressions: 260000, clicks: 2600, leads: 55, ql: 19, sv: 6 },
    ] },
    onSave: async (blob, info) => { console.log('Save to your storage:', info.name, blob.size, 'bytes'); },
    onAIResult: (creative, result) => console.log('Store this AI reading with the creative:', creative.name, result),
  });

  // A made-up feed creative drawn on a canvas, so the demo works without any files.
  function sampleCreative() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const x = c.getContext('2d');
    const sky = x.createLinearGradient(0, 0, 0, 900); sky.addColorStop(0, '#9cc7e8'); sky.addColorStop(1, '#f2d7b3'); x.fillStyle = sky; x.fillRect(0, 0, 1080, 900);
    x.fillStyle = '#3d6b4f'; x.fillRect(0, 780, 1080, 120);
    [[120, 260, 220, 560, '#d9dde3'], [380, 160, 260, 660, '#c7ccd4'], [680, 300, 240, 520, '#e1e4e8']].forEach(([X, Y, W, H, col]) => {
      const f = x.createLinearGradient(X, 0, X + W, 0); f.addColorStop(0, col); f.addColorStop(1, '#aeb6c1'); x.fillStyle = f; x.fillRect(X, Y, W, H);
      x.fillStyle = 'rgba(110,135,165,.35)';   // glass bands, soft like a photo
      for (let r = Y + 40; r < Y + H - 60; r += 90) x.fillRect(X + 16, r, W - 32, 36);
    });
    x.fillStyle = '#1d2b3a'; x.fillRect(0, 900, 1080, 450);
    x.fillStyle = '#ffffff'; x.font = '700 64px system-ui'; x.fillText('Lake-view living', 60, 1000);
    x.font = '400 34px system-ui'; x.fillStyle = '#cfd8e3'; x.fillText('2 & 3 BHK · Ghodbunder Road, Thane', 60, 1056);
    x.font = '600 30px system-ui'; x.fillStyle = '#f0b44c'; x.fillText('Starting ₹1.15 Cr*', 60, 1120);
    x.font = '400 22px system-ui'; x.fillStyle = '#8fa1b5'; x.fillText('Amenities · Clubhouse · Pool · Gym · Kids play · Jogging track · Podium garden', 60, 1180);
    x.fillText('MahaRERA P51700000000 · harbourline.example · T&C apply', 60, 1300);
    x.font = '700 30px system-ui'; x.fillStyle = '#fff'; x.fillText('HARBOURLINE', 60, 70);
    return c.toDataURL('image/jpeg', 0.9);
  }
  // The same creative laid out the MahaRERA way: registration number, website and QR code together in the top-right corner.
  async function sampleRera() {
    const base = new Image(); base.src = sampleCreative(); await base.decode();
    const qr = new Image(); qr.src = project.reraQr; await qr.decode();
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const x = c.getContext('2d'); x.drawImage(base, 0, 0);
    x.fillStyle = '#1d2b3a'; x.fillRect(0, 1270, 1080, 80);                                  // cover the old bottom line
    x.fillStyle = '#8fa1b5'; x.font = '400 26px system-ui'; x.fillText('Site address: Harbourline Sales Lounge, Ghodbunder Road, Thane W', 60, 1310);
    x.fillStyle = 'rgba(255,255,255,.96)'; x.fillRect(560, 24, 496, 150);
    x.drawImage(qr, 916, 34, 130, 130); x.fillStyle = '#5b6470'; x.font = '600 20px system-ui'; x.fillText('MahaRERA Reg. No.', 580, 70);
    x.fillStyle = '#111418'; x.font = '800 28px system-ui'; x.fillText('P51700000000', 580, 108); x.font = '600 24px system-ui'; x.fillText('maharera.maharashtra.gov.in', 580, 146);
    return c.toDataURL('image/jpeg', 0.92);
  }
  document.getElementById('sampleRera').onclick = async () => studio.add([{ name: 'Harbourline with RERA block', src: await sampleRera() }]);
  document.getElementById('sample').onclick = () => studio.add([{ name: 'Harbourline lake view static', src: sampleCreative() }]);
  // Two more made-up cards for the carousel sample: an interior and a location card with the call to action.
  function sampleCard(kind) {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const x = c.getContext('2d');
    if (kind === 'interior') {
      const wall = x.createLinearGradient(0, 0, 1080, 0); wall.addColorStop(0, '#e9dcc8'); wall.addColorStop(1, '#cdb79a'); x.fillStyle = wall; x.fillRect(0, 0, 1080, 1350);
      x.fillStyle = '#b9d6ee'; x.fillRect(560, 160, 400, 520); x.fillStyle = '#8a6b4e'; x.fillRect(0, 900, 1080, 450);
      x.fillStyle = '#5f6f7d'; x.fillRect(120, 700, 520, 200); x.fillStyle = '#7b8a97'; x.fillRect(120, 640, 520, 80);
      x.fillStyle = '#fff'; x.font = '700 60px system-ui'; x.fillText('Bright 3 BHK homes', 60, 1060);
      x.font = '400 34px system-ui'; x.fillStyle = '#f3e9dc'; x.fillText('1,180 sq ft · Lake-facing decks', 60, 1118);
    } else {
      x.fillStyle = '#e7ecef'; x.fillRect(0, 0, 1080, 1350); x.strokeStyle = '#c3ccd3'; x.lineWidth = 14;
      [[0, 300, 1080, 420], [200, 0, 420, 1350], [0, 900, 1080, 760]].forEach(([a, b, c2, d]) => { x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); });
      x.fillStyle = '#3d7fb5'; x.fillRect(640, 120, 340, 260); x.fillStyle = '#d9473b'; x.beginPath(); x.arc(470, 560, 34, 0, 7); x.fill();
      x.fillStyle = '#1d2b3a'; x.fillRect(0, 960, 1080, 390); x.fillStyle = '#fff'; x.font = '700 58px system-ui'; x.fillText('5 min to the metro', 60, 1060);
      x.font = '400 32px system-ui'; x.fillStyle = '#cfd8e3'; x.fillText('Ghodbunder Road · Thane West', 60, 1112);
      x.fillStyle = '#f0b44c'; x.beginPath(); x.roundRect ? x.roundRect(60, 1170, 400, 86, 43) : x.rect(60, 1170, 400, 86); x.fill();
      x.fillStyle = '#111'; x.font = '700 34px system-ui'; x.fillText('Book a site visit →', 96, 1224);
    }
    return c.toDataURL('image/jpeg', 0.9);
  }
  document.getElementById('sampleCar').onclick = () => studio.add([{ name: 'Harbourline carousel', 
    cards: [{ src: sampleCard('interior'), name: 'Interior' }, { src: sampleCreative(), name: 'Towers' }, { src: sampleCard('location'), name: 'Location' }] }]);
  document.getElementById('dump').onclick = () => { const o = document.getElementById('out'); o.hidden = false; o.textContent = JSON.stringify(studio.list(), null, 2); };
</script>
</body>
</html>
