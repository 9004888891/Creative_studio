<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Creative Studio</title>
<link rel="stylesheet" href="/creative-heatmap.css">
<style>
:root { --page: #eef1f5; --ink: #18202b; --muted: #5d6877; --line: #dfe3e8; --card: #ffffff; --accent: #1f5f8b; --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --page: #0f1318; --ink: #e6eaef; --muted: #9aa5b3; --line: #2e3742; --card: #151a21; --accent: #6fb0dc; color-scheme: dark; } }
* { box-sizing: border-box; } html, body { margin: 0; } body { background: var(--page); color: var(--ink); font: 15px/1.5 var(--font); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 14px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between; }
.top h1 { margin: 0; font-size: 22px; } .top p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.pick { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
.pick select { font: 14px var(--font); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; max-width: 100%; }
#studio { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.note { color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Creative Studio</h1><p id="who">Signing in…</p></div>
    <label class="pick" for="proj">Project<select id="proj"><option value="">Loading…</option></select></label>
  </div>
  <div id="studio"></div>
  <p class="note" id="feat"></p>
</div>
<script src="/creative-heatmap.js"></script>
<script>
(async () => {
  const me = await (await fetch('/api/me', { credentials: 'same-origin' })).json();
  let lib = { records: [], facts: {}, briefs: {} };
  try { lib = await (await fetch('/api/creative-library', { credentials: 'same-origin' })).json(); } catch (e) { /* the studio shows its own message */ }
  const brandOf = {};
  (lib.records || []).forEach(r => { if (r.project && !brandOf[r.project]) brandOf[r.project] = r.brand || ''; });
  Object.entries(lib.facts || {}).forEach(([p, f]) => { if (!brandOf[p]) brandOf[p] = f.developer || f.brand || ''; });
  Object.keys(lib.briefs || {}).forEach(p => { if (!(p in brandOf)) brandOf[p] = (lib.briefs[p] || {}).developer || ''; });
  (me.projects || []).forEach(p => { if (!(p in brandOf)) brandOf[p] = ''; });
  const projects = Object.keys(brandOf).filter(p => me.role === 'admin' || !me.projects || me.projects.includes(p)).sort();
  const sel = document.getElementById('proj');
  const opt = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; return o; };
  sel.textContent = ''; sel.append(opt('', 'Choose a project'), ...projects.map(p => opt(p, brandOf[p] ? `${p} · ${brandOf[p]}` : p)));
  try { const last = localStorage.getItem('cs-project'); if (last && projects.includes(last)) sel.value = last; } catch (e) { /* private window */ }
  document.getElementById('who').textContent = `Signed in as ${me.user} (${me.role}). ${me.role === 'viewer' ? 'You can view creatives and reports.' : 'Choose the project before adding its creatives.'}`;
  document.getElementById('feat').textContent = [me.features.ai ? '' : 'AI reading is off (add ANTHROPIC_API_KEY).', me.features.performance ? '' : 'Results are off (add PERF_SOURCE_URL and PERF_API_TOKEN).', me.features.transcribe ? '' : 'Voiceover transcription is off (optional: TRANSCRIBE_API_KEY).'].filter(Boolean).join(' ');
  const projectOf = new Map(), ctxFor = p => Object.assign({ project: p, developer: brandOf[p] || '' }, (lib.facts || {})[p] || {});
  const feedFor = p => me.features.performance && p ? { url: '/api/creative-performance?project=' + encodeURIComponent(p) } : null;
  const studio = window.studio = new CreativeHeatmap(document.getElementById('studio'), {
    title: 'Creative studio',
    context: c => ctxFor((c && projectOf.get(c.id)) || sel.value),
    ai: me.features.ai ? { endpoint: '/api/creative-analyze' } : null,
    transcribe: me.features.transcribe ? { endpoint: '/api/creative-transcribe' } : null,
    library: { url: '/api/creative-library', save: me.role !== 'viewer' },
    performanceFeed: feedFor(sel.value),
    can: { edit: me.role !== 'viewer', remove: me.role !== 'viewer', versions: me.role !== 'viewer', budget: !me.hideBudget },
    onChange: (ev, c) => { if (ev === 'added' && c && !projectOf.has(c.id)) projectOf.set(c.id, sel.value); },
  });
  sel.addEventListener('change', () => { try { localStorage.setItem('cs-project', sel.value); } catch (e) { /* ignore */ } studio.o.performanceFeed = feedFor(sel.value); studio._feedP = null; studio.items.forEach(c => { c.perf = null; }); studio.render(); });
})().catch(e => { document.getElementById('who').textContent = 'Creative Studio could not start: ' + e.message; });
</script>
</body>
</html>
